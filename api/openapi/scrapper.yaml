openapi: 3.0.3
info:
  title: Scrapper API
  version: 1.0.0
  description: API сервиса Scrapper для регистрации чатов и управления отслеживаемыми ссылками

paths:
  /tg-chat/{id}:
    post:
      tags:
        - tg-chat
      summary: Register Telegram chat
      operationId: registerTgChat
      parameters:
        - name: id
          in: path
          required: true
          description: Telegram chat id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Chat registered successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Chat already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      tags:
        - tg-chat
      summary: Delete Telegram chat
      operationId: deleteTgChat
      parameters:
        - name: id
          in: path
          required: true
          description: Telegram chat id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Chat deleted successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /links:
    get:
      tags:
        - links
      summary: Get tracked links for chat
      operationId: getLinks
      parameters:
        - name: Tg-Chat-Id
          in: header
          required: true
          description: Telegram chat id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of tracked links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLinksResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    post:
      tags:
        - links
      summary: Add link for tracking
      operationId: addLink
      parameters:
        - name: Tg-Chat-Id
          in: header
          required: true
          description: Telegram chat id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLinkRequest'
      responses:
        '200':
          description: Link added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Link already tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      tags:
        - links
      summary: Remove tracked link
      operationId: removeLink
      parameters:
        - name: Tg-Chat-Id
          in: header
          required: true
          description: Telegram chat id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveLinkRequest'
      responses:
        '200':
          description: Link removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Chat or link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  schemas:
    AddLinkRequest:
      type: object
      required:
        - link
      properties:
        link:
          type: string
          format: uri
          example: https://github.com/user/repo
        tags:
          type: array
          items:
            type: string
          example: [work, docs]
        filters:
          type: array
          items:
            type: string
          example: [comments]

    RemoveLinkRequest:
      type: object
      required:
        - link
      properties:
        link:
          type: string
          format: uri
          example: https://github.com/user/repo

    LinkResponse:
      type: object
      required:
        - id
        - url
        - tags
        - filters
      properties:
        id:
          type: integer
          format: int64
          example: 1
        url:
          type: string
          format: uri
          example: https://github.com/user/repo
        tags:
          type: array
          items:
            type: string
          example: [work, docs]
        filters:
          type: array
          items:
            type: string
          example: [comments]

    ListLinksResponse:
      type: object
      required:
        - links
        - size
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkResponse'
        size:
          type: integer
          format: int32
          example: 1

    ApiErrorResponse:
      type: object
      required:
        - description
        - code
        - exceptionName
        - exceptionMessage
        - stacktrace
      properties:
        description:
          type: string
          example: Invalid request parameters
        code:
          type: string
          example: 400
        exceptionName:
          type: string
          example: BadRequestException
        exceptionMessage:
          type: string
          example: Tg-Chat-Id header is required
        stacktrace:
          type: array
          items:
            type: string
          example:
            - "stack trace line 1"
            - "stack trace line 2"