openapi: 3.0.3
info:
  title: Bot API
  version: 1.0.0
  description: API сервиса Bot для получения уведомлений об обновлениях ссылок

paths:
  /updates:
    post:
      tags:
        - updates
      summary: Send link update notification
      operationId: postUpdates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkUpdate'
      responses:
        '200':
          description: Update accepted
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  schemas:
    LinkUpdate:
      type: object
      required:
        - id
        - url
        - description
        - tgChatIds
      properties:
        id:
          type: integer
          format: int64
          example: 1
        url:
          type: string
          format: uri
          example: https://github.com/user/repo
        description:
          type: string
          example: Repository was updated
        tgChatIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    ApiErrorResponse:
      type: object
      required:
        - description
        - code
        - exceptionName
        - exceptionMessage
        - stacktrace
      properties:
        description:
          type: string
          example: Invalid request body
        code:
          type: string
          example: 400
        exceptionName:
          type: string
          example: BadRequestException
        exceptionMessage:
          type: string
          example: Field tgChatIds is required
        stacktrace:
          type: array
          items:
            type: string
          example:
            - "stack trace line 1"
            - "stack trace line 2"