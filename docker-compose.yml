services:
  postgres:
    image: postgres:16
    container_name: link-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB}
      POSTGRES_USER: ${APP_DATABASE_USER}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DATABASE_USER} -d ${APP_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  flyway:
    image: flyway/flyway:10
    container_name: link-tracker-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${APP_POSTGRES_DB}
      FLYWAY_USER: ${APP_DATABASE_USER}
      FLYWAY_PASSWORD: ${APP_DATABASE_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate

volumes:
  postgres-data:
